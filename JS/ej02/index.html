<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS-E2</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
      }
    </style>
  </head>

  <body>
    <div id="contenido" style="height: 200px; width: 400px"></div>
    <script>
      var colores = [
        "red",
        "orange",
        "yellow",
        "lime",
        "cyan",
        "blue",
        "purple",
      ];
      var indice = 0;

      function cambiarColor() {
        var contenidoDiv = document.getElementById("contenido");
        contenidoDiv.style.backgroundColor = colores[indice];
        indice = (indice + 1) % colores.length;
      }

      setInterval(cambiarColor, 1000);
    </script>
  </body>
</html>
